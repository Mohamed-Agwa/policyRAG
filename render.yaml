# Render Blueprint: New > Blueprint > connect this repo.
# Free web service: 512 MB RAM, 0.1 CPU, spins down after 15 idle minutes.
services:
  - type: web
    name: nilebyte-policy-assistant
    runtime: python
    plan: free
    # Build installs dependencies, builds the Chroma index from data/policies
    # and downloads the embedding + re-ranker models into .models/, so
    # nothing is downloaded at request time.
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    # One worker keeps memory low; threads handle concurrent requests.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false        # set the value in the Render dashboard
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: WARMUP_ON_START
        value: "true"
      - key: USE_RERANKER
        value: "true"      # set to "false" if the instance runs out of memory
