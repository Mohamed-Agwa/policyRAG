# Render Blueprint: New > Blueprint > connect this repo.
# Free web service: 512 MB RAM, 0.1 CPU, spins down after 15 idle minutes.
services:
  - type: web
    name: nilebyte-policy-assistant
    runtime: python
    plan: free
    # Build installs dependencies, builds the Chroma index from data/policies
    # and downloads the embedding + re-ranker models into .models/, so
    # nothing is downloaded at request time.
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    # One worker keeps memory low; threads handle concurrent requests.
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false        # set the value in the Render dashboard
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Memory: the free instance has 512 MB. Two ONNX models + Chroma exceed it
      # and Render silently restarts the instance (seen as intermittent 502s).
      # So the deployed app runs without the re-ranker (its effect is measured
      # in the "no_rerank" ablation) and with single-threaded ONNX Runtime.
      - key: USE_RERANKER
        value: "false"
      - key: ONNX_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_TIMEOUT
        value: "45"
      - key: WARMUP_ON_START
        value: "true"      # load the index + embedding model at boot for a fast first answer
