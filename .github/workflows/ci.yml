name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build check (import the app)
        run: python -c "import app; print('app imports OK')"

      - name: Corpus check
        run: python -m rag.ingest --stats

      - name: Run tests (fake LLM + fake embeddings, no API key needed)
        run: pytest -q

  deploy:
    # Optional: deploy to Render only after tests pass on main.
    # Add a repository secret RENDER_DEPLOY_HOOK_URL (Render > your service >
    # Settings > Deploy Hook) and set Auto-Deploy to "Off" in Render.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered."
          fi
